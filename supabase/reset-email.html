<!-- Paste into Supabase > Authentication > Emails > Reset password (the message body).
     Subject line to use: Reset your GymRank password -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#08080a;padding:56px 24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:400px;text-align:left;">
        <tr>
          <td style="font-size:18px;font-weight:700;letter-spacing:-0.4px;color:#f5f5f7;">Gym<span style="color:#ff4d57;">Rank</span></td>
        </tr>
        <tr>
          <td style="padding-top:40px;font-size:26px;line-height:1.25;font-weight:700;letter-spacing:-0.6px;color:#f5f5f7;">Reset your password</td>
        </tr>
        <tr>
          <td style="padding-top:12px;font-size:16px;line-height:1.6;color:#8e8e96;">Tap the button to choose a new password. The link works once.</td>
        </tr>
        <tr>
          <td style="padding-top:32px;">
            <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#dc2e34;color:#ffffff;font-size:16px;font-weight:600;text-decoration:none;padding:14px 28px;border-radius:12px;">Choose new password</a>
          </td>
        </tr>
        <tr>
          <td style="padding-top:48px;font-size:13px;line-height:1.6;color:#5c5c66;">If you didn't ask to reset your password, you can ignore this email. Your password stays the same.</td>
        </tr>
      </table>
    </td>
  </tr>
</table>
